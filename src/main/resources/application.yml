spring:
  application:
    name: spring-lab
  messages:
    encoding: UTF-8
    basename: messages

server:
  port: 8080

app:
  owner: Mautkan Nurbolat
  group: 2405IS
  mail:
    from: no-reply@iitu.kz
    retry-count: 3
    timeout: 5s
    enabled: true
  security:
    token-ttl: 30m
    min-password-length: 8
  css:
    owner: "nura"
    group: "RWPSF 3305"
    mail:
      host: "localhost"
      port: 25
      username: "test"
    security:
      enabled: false

logging:
  level:
    kz.iitu: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,env,configprops,conditions
  endpoint:
    env:
      show-values: always

  spring:
  mvc:
    problemdetails:
      enabled: true