<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Admin Panel</title>
</head>
<body>
<h1>Administration (Admin only)</h1>
<table border="1">
    <tr><th>ID</th><th>Username</th><th>Roles</th></tr>
    <tr th:each="u : ${users}">
        <td th:text="${u.id}"></td>
        <td th:text="${u.username}"></td>
        <td th:text="${u.roles}"></td>
    </tr>
</table>
<br>
<a th:href="@{/books}">Back to Books</a>
</body>
</html>
