<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${title}">Book details</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>

<h1 th:text="${title}">Book details</h1>

<table>
    <tr><th>#</th><td th:text="${book.id}">1</td></tr>
    <tr><th>Title</th><td th:text="${book.title}">Title</td></tr>
    <tr><th>Author</th><td th:text="${book.author}">Author</td></tr>
    <tr><th>Year</th><td th:text="${book.year}">2020</td></tr>
</table>

<p><a th:href="@{/books}">Back to catalogue</a></p>

</body>
</html>
