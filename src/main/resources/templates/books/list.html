<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${title}">Catalogue</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>

<h1 th:text="${title}">Catalogue</h1>

<p th:if="${message}" class="flash" th:text="${message}"></p>

<p><a th:href="@{/books/new}" th:text="#{book.new}">Add a new book</a></p>

<table>
    <thead>
    <tr><th>#</th><th>Title</th><th>Author</th><th>Year</th><th></th></tr>
    </thead>
    <tbody>
    <tr th:each="book : ${books}">
        <td><a th:href="@{/books/{id}(id=${book.id})}" th:text="${book.id}">1</a></td>
        <td th:text="${book.title}">Title</td>
        <td th:text="${book.author}">Author</td>
        <td th:text="${book.year}">2020</td>
        <td><a th:href="@{/books/{id}/edit(id=${book.id})}" th:text="#{book.edit}">Edit</a></td>
    </tr>
    </tbody>
</table>

</body>
</html>
